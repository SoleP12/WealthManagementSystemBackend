<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/login.css">
    <title>Login | Your Wealth In Your Hands</title>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <header>Wealth M Login</header>
            <header></header>
        </div>
        <div class="input-box">
            <input type="text" id="email" class="input-field" placeholder="Email" autocomplete="off" required>
        </div>


        <div class="input-box">
            <input type="password" id="password" class="input-field" placeholder="Password" autocomplete="off" required>
        </div>
        
        
        <div class="input-submit">
            <button type="button" class="submit-btn" id="submit" onclick="login(event)">
                Sign In
            </button>
        </div>
        
        
        <div class="input-create">
            <form action="createAccount">
                <a href="/WealthManage/backend/templates/register.html">
                <button type="submit" class="create-btn" id="create" onclick="">
                    Create Account
                </button>
                </a>
            </form>
        </div> 
        
        

    </div>
    <script src="/static/login.js"></script>
</body>
</html>
