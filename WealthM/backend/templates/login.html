
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/login1.css">

    <title>Login | Your Wealth In Your Hands</title>
</head>

<body>
    <!-- Navigation -->
    <nav class="navBar">
        <a href="/">Home</a>
        <a class="active" href="/login">Login</a>
        <a href="/register">Open an Account</a>
        <a href="#">About</a>
    </nav>
    
    <!-- Login Area -->
    <main class="login-container">

        <div class="login-box">

            <div class="login-header">
                <header>Wealth M Login</header>
            </div>

            <div class="input-box">
                <input
                    type="text"
                    id="email"
                    class="input-field"
                    placeholder="Email"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="input-box">
                <input
                    type="password"
                    id="password"
                    class="input-field"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="input-submit">
                <button
                    type="button"
                    class="submit-btn"
                    id="submit"
                    onclick="login(event)"
                >
                    Sign In
                </button>
            </div>

            <div class="input-create">
                <a href="/register">
                    <button
                        type="button"
                        class="create-btn"
                        id="create"
                    >
                        Create Account
                    </button>
                </a>
            </div>

        </div>

    </main>

    <script src="/static/login.js"></script>

</body>
</html>
