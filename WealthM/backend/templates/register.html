<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/register.css">
    <title>Create Account</title>

</head>

<body style="text-align: center;">

<div class="container">
    <h2>Create Account</h2>
    <form id = "register-form">
        <input type="text" name="name" placeholder="Full Name" required>

        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <input type="number" step="0.01" name="total_assets" placeholder="Total Assets">

        <input type="number" step="0.01" name="total_debt" placeholder="Total Debt">

        <input type="tel" name="phone_number" placeholder="Phone Number">

        <button onclick="location.href='/'" type="submit"> Register</button>
    </form>
    <script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const form = e.target;

    const response = await fetch("/api/users/creation", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: form.name.value,
            email: form.email.value,
            password: form.password.value,
            total_assets: Number(form.total_assets.value) || 0,
            total_debt: Number(form.total_debt.value) || 0,
            phone_number: form.phone_number.value || 0
            
        })
    });

    console.log(await response.json());
    
});
</script>
    <div class="footer">
        Already have an account?
        <a href="/login">Login</a>
    </div>
</div>

</body>
</html>
